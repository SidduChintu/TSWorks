name: Build and Update Surface Container

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Choose environment (dev/prod)"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

env:
  AWS_REGION: us-east-1

permissions:
  id-token: write
  contents: read

jobs:
  build-and-update:
    name: Build Image and Update Task Definition
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment variables
        id: env-config
        run: |
          ENV="${{ github.event.inputs.environment }}"
          
          if [ "$ENV" == "prod" ]; then
            echo "account_id=${{ secrets.PRODUCTION_ACCOUNT_ID }}" >> $GITHUB_OUTPUT
            echo "role_name=" >> $GITHUB_OUTPUT
            echo "ecr_repository=" >> $GITHUB_OUTPUT
            echo "ecs_cluster=" >> $GITHUB_OUTPUT
            echo "task_definition_family=" >> $GITHUB_OUTPUT
            echo "container_name=" >> $GITHUB_OUTPUT
            echo "env_prefix=PROD" >> $GITHUB_OUTPUT
            # Production network configuration
            echo "subnets=${{ secrets.PROD_SUBNET_IDS }}" >> $GITHUB_OUTPUT
            echo "security_groups=${{ secrets.PROD_SECURITY_GROUP_IDS }}" >> $GITHUB_OUTPUT
            echo "assign_public_ip=${{ secrets.PROD_ASSIGN_PUBLIC_IP || 'ENABLED' }}" >> $GITHUB_OUTPUT
          else
            echo "account_id=${{ secrets.DEVELOPMENT_ACCOUNT_ID }}" >> $GITHUB_OUTPUT
            echo "role_name=${{ secrets.DEV_ROLE_NAME }}" >> $GITHUB_OUTPUT
            echo "ecr_repository=${{ secrets.DEV_SURF_ECR_REPOSITORY }}" >> $GITHUB_OUTPUT
            echo "ecs_cluster=${{ secrets.DEV_ECS_CLUSTER }}" >> $GITHUB_OUTPUT
            echo "task_definition_family=${{ secrets.DEV_SURF_TASK_DEFINITION_FAMILY }}" >> $GITHUB_OUTPUT
            echo "container_name=${{ secrets.DEV_SURF_CONTAINER_NAME }}" >> $GITHUB_OUTPUT
            echo "env_prefix=DEV" >> $GITHUB_OUTPUT
            # Development network configuration
            echo "subnets=${{ secrets.DEV_SUBNET_IDS }}" >> $GITHUB_OUTPUT
            echo "security_groups=${{ secrets.DEV_SECURITY_GROUP_IDS }}" >> $GITHUB_OUTPUT
            echo "assign_public_ip=${{ secrets.DEV_ASSIGN_PUBLIC_IP || 'ENABLED' }}" >> $GITHUB_OUTPUT
          fi

      ########################################################################
      # AWS Authentication - Environment Specific
      ########################################################################
      - name: Configure AWS Credentials for ${{ github.event.inputs.environment }} environment
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{ steps.env-config.outputs.account_id }}:role/${{ steps.env-config.outputs.role_name }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubOIDC-${{ github.event.inputs.environment }}

      - name: Verify AWS Identity
        run: |
          echo "================================================================"
          echo "  Authenticating to ${{ github.event.inputs.environment }} environment"
          echo "================================================================"
          aws sts get-caller-identity
          echo ""

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate image tags
        id: image-tags
        run: |
          # Environment-aware tags
          ENV="${{ github.event.inputs.environment }}"
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          
          # Primary tags with environment prefix for timestamp (for lifecycle management)
          echo "timestamp_tag=${ENV}-${TIMESTAMP}" >> $GITHUB_OUTPUT
          echo "sha_tag=${ENV}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          
          # Use simple "latest" tag for task definition (same for all environments)
          echo "latest_tag=latest" >> $GITHUB_OUTPUT

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ steps.env-config.outputs.ecr_repository }}
          TIMESTAMP_TAG: ${{ steps.image-tags.outputs.timestamp_tag }}
          LATEST_TAG: ${{ steps.image-tags.outputs.latest_tag }}
        run: |
          echo "================================================================"
          echo "  Building image for ${{ github.event.inputs.environment }} environment"
          echo "================================================================"
          
          # Build the Docker image with timestamp tag
          docker build -f Dockerfile.surface -t $ECR_REGISTRY/$ECR_REPOSITORY:$TIMESTAMP_TAG .
          
          # Tag with "latest" (same for all environments)
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$TIMESTAMP_TAG $ECR_REGISTRY/$ECR_REPOSITORY:$LATEST_TAG
          
          # Push both tags
          echo "Pushing images to ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$TIMESTAMP_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$LATEST_TAG
          
          # Output the latest tag for task definition
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "image_uri=$ECR_REGISTRY/$ECR_REPOSITORY" >> $GITHUB_OUTPUT
          echo "timestamp_image=$ECR_REGISTRY/$ECR_REPOSITORY:$TIMESTAMP_TAG" >> $GITHUB_OUTPUT
          
          echo ""
          echo " Image successfully pushed"
          echo "   Timestamp Tag: $TIMESTAMP_TAG (for lifecycle tracking)"
          echo "   Latest Tag: $LATEST_TAG (used in task definition)"

      - name: Download current task definition
        id: current-task-def
        env:
          TASK_DEFINITION_FAMILY: ${{ steps.env-config.outputs.task_definition_family }}
          CONTAINER_NAME: ${{ steps.env-config.outputs.container_name }}
        run: |
          # Get current task definition
          aws ecs describe-task-definition \
            --task-definition $TASK_DEFINITION_FAMILY \
            --query taskDefinition > task-definition.json
          
          # Extract current revision and image
          CURRENT_REVISION=$(jq -r '.revision' task-definition.json)
          CURRENT_IMAGE=$(jq -r --arg CONTAINER "$CONTAINER_NAME" \
            '.containerDefinitions[] | select(.name == $CONTAINER) | .image' task-definition.json)
          
          echo "current_revision=$CURRENT_REVISION" >> $GITHUB_OUTPUT
          echo "current_image=$CURRENT_IMAGE" >> $GITHUB_OUTPUT
          
          # Clean task definition for registration
          cat task-definition.json | jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' > task-def-clean.json

      - name: Update task definition with new image and environment variables
        env:
          CONTAINER_NAME: ${{ steps.env-config.outputs.container_name }}
          ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: |
          # Update the image in the task definition
          jq --arg IMAGE "${{ steps.build-image.outputs.image }}" \
             --arg CONTAINER "$CONTAINER_NAME" \
             '(.containerDefinitions[] | select(.name == $CONTAINER) | .image) = $IMAGE' \
             task-def-clean.json > task-def-temp.json
          
          # Define environment-specific variables and secrets
          if [ "$ENVIRONMENT" == "prod" ]; then
            Production environment variables

            ENV_VARS='[
              {"name": "ENVIRONMENT", "value": "prod"},
              {"name": "secret_name", "value": ""},
              {"name": "secrets_postgres", "value": ""}
            ]'
            
            # Production secrets from AWS Secrets Manager
            SECRETS='[
              {"name": "DB_PASSWORD", "valueFrom": ""},
              {"name": "DB_URL", "valueFrom": "},
              {"name": "DB_USER", "valueFrom": ""}
            ]'
          else
            # Development environment variables
            ENV_VARS='[
              {"name": "ENVIRONMENT", "value": "development"},
              {"name": "secret_name", "value": "${{ secrets.SECRET_NAME }}"},
              {"name": "secrets_postgres", "value": "${{ secrets.SECRETS_POSTGRES }}"}
            ]'
            
            # Development secrets from AWS Secrets Manager
            SECRETS='[
              {"name": "DB_PASSWORD", "valueFrom": "${{ secrets.DB_PASSWORD }}"},
              {"name": "DB_URL", "valueFrom": "${{ secrets.DB_URL }}"},
              {"name": "DB_USER", "valueFrom": "${{ secrets.DB_USER }}"}
            ]'
          fi
          
          # Replace ACCOUNT_ID placeholder with actual account ID
          ACCOUNT_ID="${{ steps.env-config.outputs.account_id }}"
          SECRETS=$(echo "$SECRETS" | sed "s/ACCOUNT_ID/$ACCOUNT_ID/g")
          
          # Update environment variables and secrets in the task definition
          jq --arg CONTAINER "$CONTAINER_NAME" \
             --argjson ENV_VARS "$ENV_VARS" \
             --argjson SECRETS "$SECRETS" \
             '(.containerDefinitions[] | select(.name == $CONTAINER) | .environment) = $ENV_VARS |
              (.containerDefinitions[] | select(.name == $CONTAINER) | .secrets) = $SECRETS' \
             task-def-temp.json > task-def-updated.json
          
          echo "Task definition updated with image, environment variables, and secrets"
          
          # Display what was updated
          echo ""
          echo "Environment Variables Added/Updated:"
          echo "$ENV_VARS" | jq -r '.[] | "  \(.name) = \(.value)"'
          echo ""
          echo "Secrets Configured:"
          echo "$SECRETS" | jq -r '.[] | "  \(.name) -> \(.valueFrom)"'

      - name: Register new task definition
        id: register-task-def
        run: |
          echo "Registering new task definition for ${{ github.event.inputs.environment }} environment..."
          
          # Register the new task definition
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-def-updated.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          
          NEW_REVISION=$(echo $TASK_DEF_ARN | rev | cut -d':' -f1 | rev)
          
          echo "task_def_arn=$TASK_DEF_ARN" >> $GITHUB_OUTPUT
          echo "new_revision=$NEW_REVISION" >> $GITHUB_OUTPUT

      - name: Display Deployment Summary
        env:
          ENV_UPPER: ${{ steps.env-config.outputs.env_prefix }}
          ENVIRONMENT: ${{ github.event.inputs.environment }}
          ECR_REPOSITORY: ${{ steps.env-config.outputs.ecr_repository }}
          ECS_CLUSTER: ${{ steps.env-config.outputs.ecs_cluster }}
          TASK_DEFINITION_FAMILY: ${{ steps.env-config.outputs.task_definition_family }}
          ACCOUNT_ID: ${{ steps.env-config.outputs.account_id }}
          CONTAINER_NAME: ${{ steps.env-config.outputs.container_name }}
        run: |
          echo "================================================================"
          echo "              DEPLOYMENT SUMMARY - $ENV_UPPER ENVIRONMENT"
          echo "================================================================"
          echo ""
          echo "  Environment: $ENVIRONMENT"
          echo "  AWS Account: $ACCOUNT_ID"
          echo "  Region: ${{ env.AWS_REGION }}"
          echo ""
          echo "================================================================"
          echo "                 ECR IMAGE DETAILS"
          echo "================================================================"
          echo ""
          echo "Repository: $ECR_REPOSITORY"
          echo ""
          echo "Tags Created:"
          echo "  ├─ Timestamp: ${{ steps.image-tags.outputs.timestamp_tag }}"
          echo "  └─ Latest:    ${{ steps.image-tags.outputs.latest_tag }}"
          echo ""
          echo "Full Image URI:"
          echo "  Task Definition: ${{ steps.build-image.outputs.image }}"
          echo "  Timestamp Reference: ${{ steps.build-image.outputs.timestamp_image }}"
          echo ""
          echo "================================================================"
          echo "             TASK DEFINITION COMPARISON"
          echo "================================================================"
          echo ""
          echo "Family: $TASK_DEFINITION_FAMILY"
          echo "Cluster: $ECS_CLUSTER"
          echo ""
          echo "┌─────────────────────────────────────────────────────────────"
          echo "│ PREVIOUS (Revision ${{ steps.current-task-def.outputs.current_revision }})"
          echo "├─────────────────────────────────────────────────────────────"
          echo "│ Image: ${{ steps.current-task-def.outputs.current_image }}"
          echo "└─────────────────────────────────────────────────────────────"
          echo ""
          echo "┌─────────────────────────────────────────────────────────────"
          echo "│ NEW (Revision ${{ steps.register-task-def.outputs.new_revision }})"
          echo "├─────────────────────────────────────────────────────────────"
          echo "│ Image: ${{ steps.build-image.outputs.image }}"
          echo "└─────────────────────────────────────────────────────────────"
          echo ""
          echo " Changes Applied:"
          echo "  • Revision: ${{ steps.current-task-def.outputs.current_revision }} → ${{ steps.register-task-def.outputs.new_revision }}"
          echo "  • Image Tag: latest (same for all environments)"
          echo "  • Timestamp Build: ${{ steps.image-tags.outputs.timestamp_tag }} (preserved in ECR)"
          echo "  • Environment Variables: Updated "
          echo "  • Secrets: Configured "
          echo "  • Environment: $ENV_UPPER"
          echo ""
          echo "================================================================"
          echo "             ENVIRONMENT CONFIGURATION"
          echo "================================================================"
          echo ""
          # Extract and display environment variables from updated task definition
          echo "Environment Variables:"
          jq -r --arg CONTAINER "$CONTAINER_NAME" \
            '.containerDefinitions[] | select(.name == $CONTAINER) | .environment[]? | "  \(.name) = \(.value)"' \
            task-def-updated.json || echo "  No environment variables configured"
          echo ""
          echo "Secrets (AWS Secrets Manager):"
          jq -r --arg CONTAINER "$CONTAINER_NAME" \
            '.containerDefinitions[] | select(.name == $CONTAINER) | .secrets[]? | "  \(.name) <- \(.valueFrom)"' \
            task-def-updated.json || echo "  No secrets configured"
          echo ""
          echo "================================================================"
          echo "             NETWORK CONFIGURATION"
          echo "================================================================"
          echo ""
          echo "Subnets: ${{ steps.env-config.outputs.subnets }}"
          echo "Security Groups: ${{ steps.env-config.outputs.security_groups }}"
          echo "Assign Public IP: ${{ steps.env-config.outputs.assign_public_ip }}"
          echo ""
          echo "Note: Network configuration is stored for reference but"
          echo "      must be specified when running tasks or updating services."
          echo ""
          echo "================================================================"
          echo "                      NEXT STEPS"
          echo "================================================================"
          echo ""
          echo "The task definition has been updated but NOT deployed."
          echo ""
          echo "To deploy the new version:"
          echo "  1. Update your ECS service to use revision ${{ steps.register-task-def.outputs.new_revision }}"
          echo "  2. Or manually run a task using the new task definition"
          echo ""
          echo "To run a task manually with this configuration:"
          echo "  aws ecs run-task \\"
          echo "    --cluster $ECS_CLUSTER \\"
          echo "    --task-definition $TASK_DEFINITION_FAMILY:${{ steps.register-task-def.outputs.new_revision }} \\"
          echo "    --launch-type FARGATE \\"
          echo "    --network-configuration \"awsvpcConfiguration={subnets=[${{ steps.env-config.outputs.subnets }}],securityGroups=[${{ steps.env-config.outputs.security_groups }}],assignPublicIp=${{ steps.env-config.outputs.assign_public_ip }}}\""
          echo ""
          echo "================================================================"
          echo "                     AWS CONSOLE LINKS"
          echo "================================================================"
          echo ""
          echo "Task Definition:"
          echo "  https://${{ env.AWS_REGION }}.console.aws.amazon.com/ecs/v2/task-definitions/$TASK_DEFINITION_FAMILY/${{ steps.register-task-def.outputs.new_revision }}"
          echo ""
          echo "ECS Cluster:"
          echo "  https://${{ env.AWS_REGION }}.console.aws.amazon.com/ecs/v2/clusters/$ECS_CLUSTER"
          echo ""
          echo "ECR Repository:"
          echo "  https://${{ env.AWS_REGION }}.console.aws.amazon.com/ecr/repositories/private/$ACCOUNT_ID/$ECR_REPOSITORY"
          echo ""
          echo "Secrets Manager:"
          echo "  https://${{ env.AWS_REGION }}.console.aws.amazon.com/secretsmanager/listsecrets?region=${{ env.AWS_REGION }}"
          echo ""
          echo "VPC Subnets:"
          echo "  https://${{ env.AWS_REGION }}.console.aws.amazon.com/vpc/home?region=${{ env.AWS_REGION }}#subnets:"
          echo ""
          echo "Security Groups:"
          echo "  https://${{ env.AWS_REGION }}.console.aws.amazon.com/vpc/home?region=${{ env.AWS_REGION }}#securityGroups:"
          echo ""
          echo "================================================================"

      - name: Create deployment artifact
        env:
          ECR_REPOSITORY: ${{ steps.env-config.outputs.ecr_repository }}
          TASK_DEFINITION_FAMILY: ${{ steps.env-config.outputs.task_definition_family }}
          ECS_CLUSTER: ${{ steps.env-config.outputs.ecs_cluster }}
          ACCOUNT_ID: ${{ steps.env-config.outputs.account_id }}
        run: |
          cat > deployment-info.json << EOF
          {
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "environment": "${{ github.event.inputs.environment }}",
            "aws_account_id": "$ACCOUNT_ID",
            "aws_region": "${{ env.AWS_REGION }}",
            "repository": "$ECR_REPOSITORY",
            "image_tags": {
              "primary": "latest",
              "timestamp": "${{ steps.image-tags.outputs.timestamp_tag }}"
            },
            "task_definition": {
              "family": "$TASK_DEFINITION_FAMILY",
              "cluster": "$ECS_CLUSTER",
              "previous_revision": "${{ steps.current-task-def.outputs.current_revision }}",
              "new_revision": "${{ steps.register-task-def.outputs.new_revision }}",
              "previous_image": "${{ steps.current-task-def.outputs.current_image }}",
              "new_image": "${{ steps.build-image.outputs.image }}"
            },
            "network_configuration": {
              "subnets": "${{ steps.env-config.outputs.subnets }}",
              "security_groups": "${{ steps.env-config.outputs.security_groups }}",
              "assign_public_ip": "${{ steps.env-config.outputs.assign_public_ip }}"
            },
            "git": {
              "sha": "${{ github.sha }}",
              "short_sha": "${{ steps.image-tags.outputs.sha_tag }}",
              "ref": "${{ github.ref }}",
              "branch": "${{ github.ref_name }}",
              "actor": "${{ github.actor }}"
            }
          }
          EOF
          
          echo " Deployment information saved"
          cat deployment-info.json

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-info-${{ github.event.inputs.environment }}-${{ steps.image-tags.outputs.timestamp_tag }}
          path: deployment-info.json
          retention-days: 90

      - name: Deployment Complete
        run: |
          echo ""
          echo " Deployment to ${{ github.event.inputs.environment }} environment completed successfully!"
          echo ""